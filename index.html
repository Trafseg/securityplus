 if(PLANILHA_WEBHOOK){fetch(PLANILHA_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name:answers.name,phone:answers.phone,location:answers.location,owner:answers.owner,property:answers.property,situation:answers.situation,urgency:answers.urgency,whatsappLink:leadWhatsappLink,eventId,fbp,fbc,userAgent:navigator.userAgent,pageUrl:location.href})}).catch(()=>{});}
 main.innerHTML=`<section class="screen thanks"><div class="success" aria-hidden="true">✓</div><div class="eyebrow">Tudo pronto para o próximo passo</div><h1 tabindex="-1">Diagnóstico Concluído com Sucesso, <span>${esc(answers.name.trim().split(/\s+/)[0])}!</span> 🎉</h1><p class="desc">Analisamos as melhores opções de monitoramento para você ${esc(answers.name.trim().split(/\s+/)[0])}. Clique abaixo para receber sua estimativa de valores no WhatsApp com um dos nossos consultores de segurança.</p><a class="primary" id="whatsapp" href="${esc(whatsappLink)}" target="_blank" rel="noopener noreferrer">💬 Falar Agora com o Consultor no WhatsApp</a><p class="micro">O atendimento começa após você enviar a mensagem no WhatsApp.</p><div class="summary"><h3>CONFIRA SUAS RESPOSTAS</h3><dl>${rows.map(([label,id])=>`<div class="row"><dt>${label}</dt><dd>${esc(answers[id])}</dd></div>`).join('')}</dl></div><button class="restart" id="restart" type="button">Recomeçar diagnóstico</button></section>`;
 document.getElementById('whatsapp').onclick=()=>{if(window.fbq)fbq('track','Contact');};
 document.getElementById('restart').onclick=()=>{for(const key of Object.keys(answers))delete answers[key];step=0;render();};
 }else{
 const q=questions[step];
 main.innerHTML=`<section class="screen"><div class="step-label"><b>${step+1}</b>${q.group}</div><h2 id="questionTitle" tabindex="-1">${q.title}</h2>${q.desc?`<p class="desc" id="description">${q.desc}</p>`:''}<form id="questionForm" novalidate>${q.options?`<div class="options" role="radiogroup" aria-labelledby="questionTitle">${q.options.map((option,i)=>`<button type="button" class="option" role="radio" aria-checked="${answers[q.id]===option}" data-index="${i}" tabindex="${answers[q.id]===option||(!answers[q.id]&&i===0)?0:-1}"><span class="key" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${option}</span><span class="check" aria-hidden="true">✓</span></button>`).join('')}</div>`:`<input class="field" id="answer" aria-label="${q.label}" aria-describedby="description error" type="${q.type||'text'}" ${q.type==='tel'?'inputmode="tel"':''} autocomplete="${q.autocomplete}" maxlength="${q.type==='tel'?20:140}" placeholder="${q.placeholder}" value="${esc(answers[q.id])}" required>`}<p class="error" id="error" role="alert"></p><div class="actions"><button class="primary" type="submit">${step===questions.length-1?'Concluir diagnóstico':'Continuar'} <span class="arrow" aria-hidden="true">→</span></button><span class="hint">pressione Enter ↵${q.options?' · ou escolha uma letra':''}</span></div></form></section>`;
 if(q.options){main.querySelectorAll('.option').forEach(button=>button.onclick=()=>selectOption(Number(button.dataset.index)));}
 else{const input=document.getElementById('answer');input.addEventListener('input',()=>{answers[q.id]=input.value;input.removeAttribute('aria-invalid');document.getElementById('error').textContent='';});if(q.type==='tel')input.addEventListener('input',()=>{let digits=input.value.replace(/\D/g,'');if(digits.startsWith('55')&&digits.length>11)digits=digits.slice(2);digits=digits.slice(0,11);input.value=digits.length>2?'('+digits.slice(0,2)+') '+digits.slice(2, digits.length>10?7:6)+(digits.length>6?'-'+digits.slice(digits.length>10?7:6):''):digits;answers[q.id]=input.value;});}
 document.getElementById('questionForm').onsubmit=event=>{event.preventDefault();advance();};
 }
 focusTitle();
}
function selectOption(index){const q=questions[step];if(!q?.options?.[index])return;answers[q.id]=q.options[index];main.querySelectorAll('.option').forEach((button,i)=>{button.setAttribute('aria-checked',i===index);button.tabIndex=i===index?0:-1;});document.getElementById('error').textContent='';clearTimeout(autoAdvanceTimer);const selectedStep=step;autoAdvanceTimer=setTimeout(()=>{autoAdvanceTimer=null;if(step===selectedStep)advance();},400);}
function advance(){const q=questions[step];let value=(answers[q.id]||'').trim(),error='';if(!value)error=q.options?'Selecione uma opção para continuar.':'Preencha este campo para continuar.';else if(q.id==='phone'&&!/^[1-9]{2}\d{8,9}$/.test(value.replace(/\D/g,'')))error='Informe um número válido com DDD (10 ou 11 dígitos).';else if(q.id==='location'&&value.length<4)error='Informe o bairro e a cidade do imóvel.';if(error){document.getElementById('error').textContent=error;const input=document.getElementById('answer');if(input){input.setAttribute('aria-invalid','true');input.focus();}return;}answers[q.id]=value;if(q.id==='phone'&&window.fbq)fbq('trackCustom','EtapaWhatsApp');step++;render();}
back.onclick=()=>{if(step>0){step--;render();}};
document.addEventListener('keydown',event=>{if(event.ctrlKey||event.altKey||event.metaKey||event.target.matches('input,textarea'))return;const q=questions[step];if(q?.options){const key=event.key.toUpperCase();if(/^[A-D]$/.test(key)){const index=key.charCodeAt(0)-65;if(index<q.options.length){event.preventDefault();selectOption(index);main.querySelectorAll('.option')[index].focus();}}else if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(event.key)){event.preventDefault();const current=q.options.indexOf(answers[q.id]);const index=(Math.max(current,0)+(['ArrowDown','ArrowRight'].includes(event.key)?1:-1)+q.options.length)%q.options.length;selectOption(index);main.querySelectorAll('.option')[index].focus();}else if(event.key==='Enter'&&!event.target.matches('.primary,.back')){event.preventDefault();advance();}}else if(event.key==='Enter'&&step===-1&&!event.target.matches('button')){event.preventDefault();step=0;render();}});
render();
</script>
</body>
</html>
